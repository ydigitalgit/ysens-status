# Pagina di stato del servizio YSENS (Y Digital). Controlli ogni 5 minuti da
# GitHub Actions sugli endpoint pubblici di salute di PRODUZIONE: rispondono 503
# quando il servizio è giù. Solo servizi che il cliente percepisce, con nomi
# per il cliente; il monitoraggio interno completo resta su UptimeRobot.
owner: ydigital-flavia
repo: ysens-status

sites:
  - name: Portale YSENS
    url: https://health-app.ysens.it/health/ysens
  - name: Ricezione dei dati dai dispositivi
    url: https://health-ingest.ysens.it/health/emqx
  - name: Salvataggio delle misure
    url: https://health-ingest.ysens.it/health/influx_data
  - name: Archivio delle misure
    url: https://health-analytics.ysens.it/health/influxdb
  - name: Regole e avvisi
    url: https://health-analytics.ysens.it/health/rules

status-website:
  # Fino al record DNS di status.ysens.it la pagina sta su GitHub Pages.
  baseUrl: /ysens-status
  name: Stato del servizio YSENS
  introTitle: "**Stato del servizio YSENS**"
  introMessage: "Qui pubblichiamo lo stato dei servizi della piattaforma YSENS, le manutenzioni programmate e gli incidenti, con i loro aggiornamenti. I controlli sono automatici ogni 5 minuti. Per assistenza scrivi a [supporto@ydigital.it](mailto:supporto@ydigital.it)."
  theme: light
  navbar:
    - title: Stato
      href: /
    - title: Y Digital
      href: https://www.ydigital.it

