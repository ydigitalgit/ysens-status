  incidentBack: ← Torna a tutti gli incidenti
  pastIncidents: Incidenti passati
  pastIncidentsResolved: Risolto in $MINUTES minuti, $POSTS aggiornamenti
  liveStatus: Stato attuale
  overallUptime: "Disponibilità: $UPTIME"
  overallUptimeTitle: Disponibilità
  averageResponseTime: "Tempo di risposta medio: $TIME ms"
  averageResponseTimeTitle: Tempo di risposta medio
  sevelDayResponseTime: Tempo di risposta a 7 giorni
